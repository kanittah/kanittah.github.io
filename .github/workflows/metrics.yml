# อัปเดตข้อมูลแดชบอร์ด (data/metrics.json) ทุกวันจันทร์ 08:00 น. เวลาไทย
# กดรันเองได้ที่แท็บ Actions → Update academic metrics → Run workflow
name: Update academic metrics

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch metrics
        env:
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python3 scripts/fetch_metrics.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/metrics.json
          git diff --cached --quiet || git commit -m "อัปเดตข้อมูลแดชบอร์ดอัตโนมัติ"
          git push

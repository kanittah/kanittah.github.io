  <script>
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <!-- หน้านี้สร้างอัตโนมัติจากไฟล์ content.yml — ไม่ต้องแก้ไฟล์นี้ -->
  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="#top"><span class="brand-badge" aria-hidden="true">侍</span><span class="brand-name" data-bind="brand"></span></a>
      <nav class="nav" id="nav" aria-label="เมนู"></nav>
      <div class="tools">
        <button class="chip" id="langBtn" type="button" aria-label="Switch language">EN</button>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="สลับโหมดสว่าง/มืด">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="เมนู">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="top">
    <div id="error" class="error" hidden></div>
    <div id="app" aria-busy="true"><p class="loading">Loading…</p></div>
  </main>

  <!-- เอกสาร CV สำหรับพิมพ์ / บันทึกเป็น PDF -->
  <div id="cv" class="cv" hidden></div>

  <!-- โหมดนำเสนอ -->
  <div id="deck" class="deck" hidden>
    <div class="deck-stage" id="deckStage"></div>
    <div class="deck-bar">
      <button type="button" class="deck-btn" id="deckPrev" aria-label="ก่อนหน้า">‹</button>
      <span id="deckCount" class="deck-count"></span>
      <button type="button" class="deck-btn" id="deckNext" aria-label="ถัดไป">›</button>
      <button type="button" class="deck-btn" id="deckFull" aria-label="เต็มจอ">⛶</button>
      <button type="button" class="deck-btn" id="deckClose" aria-label="ปิด">✕</button>
    </div>
  </div>

  <!-- กล่องแชร์ -->
  <dialog id="share" class="share">
    <form method="dialog" class="share-in">
      <h3 data-i18n="share_title"></h3>
      <div id="qr" class="qr"></div>
      <input id="shareUrl" class="share-url" readonly>
      <div class="share-actions">
        <button type="button" class="btn" id="copyBtn" data-i18n="copy_link"></button>
        <button type="button" class="btn ghost" id="qrDl" data-i18n="save_qr"></button>
        <button class="btn ghost" data-i18n="close"></button>
      </div>
      <p class="share-hint" data-i18n="share_hint"></p>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>

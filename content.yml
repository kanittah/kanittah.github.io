about:
  th: |
    อาจารย์ประจำภาควิชาครุศาสตร์ไฟฟ้า คณะครุศาสตร์อุตสาหกรรม มหาวิทยาลัยเทคโนโลยีพระจอมเกล้าพระนครเหนือ
    มีพื้นฐานด้านวิศวกรรมไฟฟ้าและเทคโนโลยีการศึกษา งานสอนและงานวิจัยมุ่งเน้นการพัฒนานักศึกษาครูช่างอุตสาหกรรม
    ระบบนิเทศการสอนฐานสมรรถนะ การนำเทคโนโลยีดิจิทัลและปัญญาประดิษฐ์มาใช้ในการจัดการเรียนรู้
    การเล่าเรื่องแบบดิจิทัล (Digital Storytelling) และระบบสารสนเทศเพื่อการศึกษา
  en: |
    Lecturer in the Department of Electrical Engineering Education, Faculty of Technical Education, KMUTNB.
    With a background in electrical engineering and educational technology, her teaching and research focus on
    developing technical and vocational preservice teachers, competency-based teaching supervision systems,
    the use of digital technology and AI in learning design, digital storytelling, and information systems for education.

